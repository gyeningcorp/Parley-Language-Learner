<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parley Audio Language Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one listening column; the interval ladder (5s → 2y) is the signature element. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#141D26; --muted:#5A6672; --line:#D3DAE1;
  --accent:#2445D6; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB; --recall:#C9701E; --good:#1D7F55; --bad:#B83A33;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --script:system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans CJK JP", "Noto Sans Arabic", "Noto Sans Devanagari", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131A; --surface:#161F29; --ink:#E6ECF2; --muted:#93A0AD; --line:#2A3542;
    --accent:#8DA3FF; --accent-ink:#0D131A; --accent-soft:#1E2A4A; --recall:#F0A25A; --good:#4CC38A; --bad:#F2766D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#161F29; --ink:#E6ECF2; --muted:#93A0AD; --line:#2A3542;
  --accent:#8DA3FF; --accent-ink:#0D131A; --accent-soft:#1E2A4A; --recall:#F0A25A; --good:#4CC38A; --bad:#F2766D; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.brand{font:700 22px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.02em;margin-top:4px;white-space:nowrap}
.chip{min-width:0;max-width:58%;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.chip .cl{overflow:hidden;text-overflow:ellipsis}
.chev{display:flex;flex:none}
.icon{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:30px;line-height:1.1}
.hero .native{font:500 15px var(--script);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-top:2px solid var(--line);padding-top:6px}
.stat b{display:block;font:500 22px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.due b{color:var(--recall)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex-direction:column;align-items:flex-start;gap:2px;padding:14px 18px}
.btn.primary .sub{font-weight:400;font-size:13px;opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.voice{font-size:13px;display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;margin-top:6px}
.dot.warn{background:var(--recall)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lessons li{border-top:1px solid var(--line)}
.lessons li:first-child{border-top:0}
.lessons button{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:none;border:0;padding:11px 2px;text-align:left}
.lessons .n{font:500 13px var(--mono);color:var(--muted)}
.lessons .t{font-weight:500}
.pill{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.pill.ready{border-color:var(--accent);color:var(--accent)}
.pill.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.method{display:grid;gap:14px}
.method>div{display:grid;grid-template-columns:28px 1fr;gap:8px}
.method .k{font:500 13px var(--mono);color:var(--accent);padding-top:2px}
.method p{margin:2px 0 0;color:var(--muted);font-size:14px}
/* Interval ladder */
.ladder{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;align-items:end}
.ladder .rung{display:flex;flex-direction:column;align-items:center;gap:4px}
.ladder .bar{width:100%;border-radius:4px 4px 2px 2px;background:var(--line);transition:background .25s}
.ladder .lbl{font:500 11px var(--mono);color:var(--muted)}
.ladder .rung.past .bar{background:var(--accent-soft)}
.ladder .rung.on .bar{background:var(--recall)}
.ladder .rung.on .lbl{color:var(--ink)}
.ladder-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet header h2{margin-right:auto}
.sheet .body{overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:16px}
.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit}
.langlist{list-style:none;margin:0;padding:0}
.langlist button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.langlist .nm{flex:1}
.langlist .nt{font:14px var(--script);color:var(--muted)}
.langlist .sel{color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.danger{color:var(--bad);border-color:var(--bad)}
/* Player */
#player{min-height:100%;display:flex;flex-direction:column}
.pwrap{max-width:560px;width:100%;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.pbar{display:flex;align-items:center;gap:10px}
.ptitle{flex:1;display:flex;flex-direction:column;line-height:1.2}
.ptitle b{font:700 16px var(--display)}
.ptitle span{font-size:12px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent);transition:width .3s}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:300px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:300px;justify-content:center}
.tag{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag.recall{color:var(--recall)}
.cue{font:500 22px/1.3 var(--body);text-wrap:balance}
.target{font:600 32px/1.25 var(--script);text-wrap:balance;min-height:1.25em;transition:filter .25s, opacity .25s}
.target.veiled{filter:blur(10px);opacity:.35;user-select:none}
.build{font:500 18px var(--script);color:var(--accent);min-height:1.4em}
.roman{font:italic 16px var(--body);color:var(--muted)}
.note{font-size:14px;color:var(--muted);max-width:40ch}
.ringbox{position:relative;width:84px;height:84px;display:grid;place-items:center}
.ringbox svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:5}
.ringbox .trk{stroke:var(--line)}
.ringbox .arc{stroke:var(--recall);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ringbox span{font:500 13px var(--mono);color:var(--muted)}
.speaking{display:flex;gap:3px;height:18px;align-items:center}
.speaking i{width:3px;height:6px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
.speaking i:nth-child(2){animation-delay:.15s}.speaking i:nth-child(3){animation-delay:.3s}.speaking i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.dialogue{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid transparent}
.line.cur{border-color:var(--accent);background:var(--surface)}
.line .who{font:600 12px var(--mono);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.line.b .who{background:var(--line);color:var(--ink)}
.line .lt{font:500 19px/1.35 var(--script)}
.line .lr{font:italic 13px var(--body);color:var(--muted)}
.line .le{font-size:13px;color:var(--muted)}
.line.veil .lt,.line.veil .lr{filter:blur(7px);opacity:.4}
.line.veil .le{visibility:hidden}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.controls .btn{padding:12px 10px}
.round{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center}
.round svg{width:26px;height:26px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grade .btn{padding:16px}
.btn.miss{border-color:var(--bad);color:var(--bad)}
.btn.got{background:var(--good);border-color:var(--good);color:var(--surface)}
.tip{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.summary .big{font:700 44px/1 var(--display)}
.wordlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wordlist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.wordlist .w{font:500 16px var(--script)}
.gen{display:flex;flex-direction:column;gap:10px}
.gen .meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.gen .meter div{height:100%;width:0;background:var(--accent);transition:width .3s}
.err{color:var(--bad);font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
select.search{appearance:auto;min-height:44px}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
@media (max-width:400px){ .hero h1{font-size:26px} .target{font-size:28px} }
</style>
</head>
<body>
<div id="home" class="wrap"></div>
<section id="player" hidden>
  <div class="pwrap">
    <div class="pbar">
      <button class="icon" id="pExit" aria-label="End lesson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="ptitle"><b id="pPhase">Listen</b><span id="pLesson" class="muted"></span></div>
      <span id="pTime" class="mono muted">0:00</span>
    </div>
    <div class="progress"><div id="pProg"></div></div>
    <div class="stage">
      <div class="card" id="cardView">
        <div class="tag" id="cTag"></div>
        <div class="cue" id="cCue"></div>
        <div class="target" id="cTarget" dir="auto"></div>
        <div class="build" id="cBuild" dir="auto"></div>
        <div class="roman" id="cRoman"></div>
        <div class="ringbox" id="ring" hidden>
          <svg viewBox="0 0 84 84"><circle class="trk" cx="42" cy="42" r="38"/><circle class="arc" id="ringArc" cx="42" cy="42" r="38" stroke-dasharray="238.76" stroke-dashoffset="0"/></svg>
          <span id="ringTxt">say it</span>
        </div>
        <div class="speaking" id="spk" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="note" id="cNote"></div>
      </div>
      <div class="dialogue" id="dlgView" hidden></div>
    </div>
    <div id="pTip" class="tip" hidden></div>
    <div>
      <div class="ladder" id="pLadder"></div>
      <div class="ladder-cap"><span>in this lesson</span><span>future reviews</span></div>
    </div>
    <div class="controls" id="ctrls">
      <button class="btn" id="bReplay">Replay</button>
      <button class="round" id="bPause" aria-label="Pause"></button>
      <button class="btn" id="bReveal">Reveal</button>
    </div>
    <div class="grade" id="grade" hidden>
      <button class="btn miss" id="bMiss">Missed it</button>
      <button class="btn got" id="bGot">Got it</button>
    </div>
  </div>
</section>
<div id="layer"></div>
<script>
/* ---------- Content: languages, syllabus, built-in Lesson 1 (original material) ---------- */
const LANGS = [

/* 30-lesson spine shared by every language: [title, can-do goal, grammar focus] */
const SYLLABUS = [
['Hello and a coffee','greet someone, order a drink politely, thank them, say goodbye','polite requests'],
['Who are you?','give your name, ask someone\'s name, say where you are from, say "nice to meet you"','to be; my / your'],

['Work','what do you do, I work as / at, office, colleague, busy','present tense verbs'],
['Making plans','would you like to, let\'s, this evening, together, where shall we meet','invitations'],

['Describing things','big, small, new, old, good, bad, colors','adjective agreement'],

['Likes and dislikes','I like, I don\'t like, I love, my favorite; food and activities','like / love'],

function theme(n){
  if (n>=1 && n<=SYLLABUS.length){ const [title,goal,grammar]=SYLLABUS[n-1]; return {title,goal,grammar}; }
  return {title:'Conversation '+n, goal:'handle a new everyday situation while recycling and extending what the learner knows', grammar:'mixed review'};
}

  return { lesson: null, cards: list.map(([k, it]) => mkCard({ ...it, key: k, early }, 'review')), early };
}

async function startSession(kind, code, id) {
  const built = kind === 'review' ? buildReviewSession(code) : buildLessonSession(code, id);
  if (!built) return;
  TTS.unlock();
  const L = langInfo(code);
  X = { kind, code, id: String(id || ''), L, ttsLang: code.startsWith('x-') ? '' : code, lesson: built.lesson, cards: built.cards, replay: built.replay,
    t0: performance.now(), pausedMs: 0, paused: false, aborted: false, finished: false, tipIdx: 0, introduced: 0, lastNewKind: 'drill',
    mode: S.settings.mode, byKey: Object.fromEntries(built.cards.map(c => [c.key, c])), stats: { ok: 0, miss: 0 } };
  X.silentTarget = !X.ttsLang || !TTS.ok || (TTS.voices.length > 0 && !TTS.has(X.ttsLang));
  showPlayer();
  if (X.silentTarget) { const el = $('#pTip'); el.textContent = `No ${L.name} voice on this device, so ${L.name} is shown as text. Read it aloud during the pauses.`; el.hidden = false; setTimeout(() => { el.hidden = true; }, 9000); }
  try { X.wake = await navigator.wakeLock?.request('screen'); } catch {}
  X.timer = setInterval(() => { if (X && !X.paused) $('#pTime').textContent = fmtTime(clock() / SPEED); }, 1000);
  try {
    if (kind === 'lesson') await runLesson(); else await runReview();
    X.finished = true;
  } catch (e) { if (e !== ABORT) console.error(e); }
  const result = commit();
  endSession(result);
}

async function runLesson() {
  const L = X.lesson;
  phase('Get ready', 'Guided audio lesson');
  await say(`Welcome to your ${X.L.name} lesson. Listen, then speak out loud during each pause. Try to answer before the speaker. You can pause at any time.`);
  if (L.goal) await say(L.goal);
  if (L.dialogue.length) {
    phase('Listen', 'Conversation');
    await say(`Lesson ${X.id.startsWith('c') ? '' : X.id + '. '}${L.title}. First, listen to a short conversation in ${X.L.name}. You don't need to understand it yet.`);
    await playDialogue(S.settings.dlgText);
  }
  if (X.cards.some(c => c.src === 'review')) { phase('Warm-up', 'Review'); await say("Let's warm up with a few things from before."); }
  await core();
  if (L.dialogue.length) await roleplay();
  if (L.dialogue.length) {
    phase('Listen again', 'Conversation');
    await say("Now listen to the conversation again. This time, you'll understand it.");
    await playDialogue(true);
  }
  await say("That's the end of this lesson. Well done.");
}
async function roleplay() {
  phase('Your conversation', 'Take the part of speaker A');
  await say('Now take part in the conversation. You are speaker A. Use the English cue to answer out loud. Then compare with the speaker.');
  for (const line of X.lesson.dialogue) {
    check();
    if (line.s === 'A') {
      showCard({ tag: 'Your turn', cue: line.en, target: line.t, roman: line.r, veiled: true, recall: true });
      await say(line.en);
      showThinking(true);
      await wait(S.settings.think + Math.min(4, estimate(line.t) * 0.5), { skippable: true, ring: true });
      showThinking(false); reveal();
      await say(line.t, 'tgt');
      await wait(repeatPause(line.t));
    } else {
      showCard({ tag: 'Listen to your partner', cue: '', target: line.t, roman: line.r });
      await say(line.t, 'tgt', { voice: 1 });
      await wait(0.6);
    }
  }
}
async function runReview() {
  phase('Review', X.cards[0]?.early ? 'Extra practice' : 'Due today');
  await say(`Review time. ${X.cards.length} phrases in ${X.L.name}.`);
  await core();
  await say('Review complete.');
}

async function core() {
  for (;;) {
    check();
    const now = clock();
    const pending = X.cards.filter(c => c.intro && !c.done);
    const due = pending.filter(c => c.due <= now).sort((a, b) => a.due - b.due);
    if (due.length) { await recall(due[0]); continue; }
    const shaky = pending.filter(c => c.wins < 1).length;
    const nx = shaky < 3 ? nextNew() : null;
    if (nx) {
      if (nx.kind === 'drill') await recall(nx, true); else await introduce(nx);
      X.lastNewKind = nx.kind;
      continue;
    }
    if (!pending.length) { if (nextNew()) { const n2 = nextNew(); if (n2.kind === 'drill') await recall(n2, true); else await introduce(n2); continue; } break; }
    pending.sort((a, b) => a.due - b.due);
    // Do not collapse the spacing by immediately testing the next pending card.
    // Fill the gap with a listening passage, then allow a quiet recall break.
    if (X.lesson?.dialogue.length && pending[0].due - clock() > 35 && X.listeningBreakDue !== pending[0].due) {
      X.listeningBreakDue = pending[0].due;
      phase('Listening break', 'Let the phrases settle');
      await playDialogue(false);
    }
    const gap = pending[0].due - clock();
    if (gap > 0) {
      phase('Recall break', 'Next speaking prompt soon');
      showCard({ tag: 'Recall break', cue: 'Relax and listen for the next prompt.', target: '', roman: '' });
      await wait(Math.min(gap, 20));
    }
  }
}
function nextNew() {
  const fresh = X.cards.filter(c => !c.intro && c.src === 'new');
  if (!fresh.length) return null;
  const items = fresh.filter(c => c.kind === 'item');
  const ready = fresh.filter(c => c.kind === 'drill' && c.uses.every(k => { const u = X.byKey[k]; return !u || (u.intro && u.wins >= 1); }));
  if (ready.length && (X.lastNewKind === 'item' || !items.length)) return ready[0];
  if (items.length) return items[0];
  return fresh[0];
}

async function introduce(c) {
  c.intro = true; X.current = c; X.introduced++;
  phase('New phrase', 'Listen and repeat');
  showCard({ tag: 'New', cue: c.en, target: c.t, roman: c.r, veiled: false });
  ladderFor(c);
  await say(pick(P_INTRO)(c.en));
  await say(c.t, 'tgt');
  await say(X.introduced <= 3 ? P_REPEAT[0] : pick(P_REPEAT));
  await say(c.t, 'tgt', { slow: true });
  await wait(repeatPause(c.t));
  if (c.build.length > 1) {
    await say(pick(P_BUILD));
    for (const ch of c.build) {
      setBuild(ch);
      await say(ch, 'tgt', { slow: true });
      await wait(repeatPause(ch));
    }
    setBuild('');
  }
  if (c.note) { setNote(c.note); await say(c.note); }
  await say(c.t, 'tgt');
  await wait(repeatPause(c.t));
  setNote('');
  c.step = 0; c.due = clock() + c.iv[0];
  await maybeTip();
}
async function maybeTip() {
  const tips = X.lesson?.tips || [];
  if (X.tipIdx < tips.length && X.introduced > 0 && X.introduced % 4 === 0) {
    const tip = tips[X.tipIdx++];
    const el = $('#pTip'); el.textContent = 'Tip: ' + tip; el.hidden = false;
    await say(tip);
    setTimeout(() => { el.hidden = true; }, 6000 / SPEED);
  }
}

async function recall(c, first = false) {
  c.intro = true; X.current = c;
  const isDrill = c.kind === 'drill';
  phase(first ? 'Put it together' : c.src === 'review' ? 'Review' : 'Recall', isDrill ? 'Build a sentence' : 'Say it before you hear it');
  showCard({ tag: first ? 'Combine' : 'Recall', cue: c.en, target: c.t, roman: c.r, veiled: true, recall: true });
  ladderFor(c);
  await say(first ? pick(P_DRILL)(c.en) : pick(P_RECALL)(c.en));
  showThinking(true);
  const think = S.settings.think + Math.min(4, estimate(c.t, 1) * 0.5);
  await wait(think, { skippable: true, ring: true });
  showThinking(false);
  reveal();
  await say(c.t, 'tgt');
  let ok = true;
  if (S.settings.mode === 'active') {
    ok = await awaitGrade();
    await say(c.t, 'tgt');
    await wait(repeatPause(c.t) * 0.8);
  } else {
    await wait(repeatPause(c.t));
    if (c.wins < 2) { await say(c.t, 'tgt'); await wait(repeatPause(c.t) * 0.8); }
  }

}
function grade(c, ok) {
  const now = clock(); c.reps++;
  if (ok) {
    X.stats.ok++; c.wins++;
    if (c.wins >= c.need) c.done = true;
    else { c.step = Math.min(c.step + 1, c.iv.length - 1); c.due = now + c.iv[c.step]; }
  } else {
    X.stats.miss++; c.lapses++;
    c.need = Math.max(c.need, c.wins + 2);
    c.step = 0; c.due = now + c.iv[0];
  }
  updateProgress();
}
function awaitGrade() {
  return new Promise((res, rej) => {
    $('#ctrls').hidden = true; $('#grade').hidden = false;
    X.onGrade = v => { X.onGrade = null; X.onAbort = null; $('#grade').hidden = true; $('#ctrls').hidden = false; res(v); };
    X.onAbort = () => { X.onGrade = null; X.onAbort = null; $('#grade').hidden = true; $('#ctrls').hidden = false; rej(ABORT); };
  });
}

async function playDialogue(showText) {
  const L = X.lesson;
  $('#cardView').hidden = true; const box = $('#dlgView'); box.hidden = false; box.replaceChildren();
  const rows = L.dialogue.map(d => {
    const el = h('div', { class: 'line ' + (d.s === 'B' ? 'b' : 'a') + (showText ? '' : ' veil') },
      h('div', { class: 'who' }, d.s),
      h('div', null, h('div', { class: 'lt', dir: 'auto', lang: X.code }, d.t), S.settings.roman && d.r ? h('div', { class: 'lr' }, d.r) : null, h('div', { class: 'le' }, d.en)));
    box.append(el); return el;
  });
  for (let i = 0; i < L.dialogue.length; i++) {
    rows.forEach(r => r.classList.remove('cur')); rows[i].classList.add('cur');
    rows[i].scrollIntoView?.({ block: 'nearest', behavior: 'smooth' });
    const d = L.dialogue[i];
    await say(d.t, 'tgt', { voice: d.s === 'B' ? 1 : 0 });
    await wait(0.6);
  }
  rows.forEach(r => r.classList.remove('cur'));
  await wait(0.8);
  box.hidden = true; $('#cardView').hidden = false;
}

function commit() {
  if (!X) return null;
  const P = prog(X.code); const now = Date.now();
  const learned = [];
  for (const c of X.cards) {
    if (!c.intro || c.reps === 0 && c.src === 'new' && !c.done && c.kind === 'drill') continue;
    const prev = P.items[c.key];
    const it = prev || { t: c.t, r: c.r, en: c.en, kind: c.kind, lesson: X.kind === 'lesson' ? X.id : '', stage: 0, due: now, reps: 0, lapses: 0 };
    it.t = c.t; it.r = c.r; it.en = c.en; it.reps = (it.reps || 0) + c.reps; it.lapses = (it.lapses || 0) + c.lapses;
    if (c.src === 'new') {
      if (!prev) learned.push(c);
      if (!prev || c.lapses) { it.stage = 0; it.due = c.done || c.wins > 0 ? now + LONG_IV[0] * DAY : now; }
    } else if (c.done || c.lapses) {
      if (c.lapses) { it.stage = 0; it.due = now + LONG_IV[0] * DAY; }
      else if (!c.early) { it.stage = Math.min((it.stage ?? 0) + 1, LONG_IV.length - 1); it.due = now + LONG_IV[it.stage] * DAY; }
    }
    it.last = now;
    P.items[c.key] = it;
  }
  const total = X.cards.reduce((s, c) => s + c.need, 0), got = X.cards.reduce((s, c) => s + Math.min(c.wins, c.need), 0);
  const frac = total ? got / total : 0;
  const acc = X.stats.ok + X.stats.miss ? X.stats.ok / (X.stats.ok + X.stats.miss) : 1;
  if (X.kind === 'lesson' && X.finished) P.done[X.id] = { at: now, acc: X.mode === 'active' ? Math.round(acc * 100) : null, mode: X.mode };
  saveProg(X.code);
  return { kind: X.kind, id: X.id, code: X.code, learned, acc, mode: X.mode, minutes: clock() / SPEED / 60, finished: X.finished, frac, reviewed: X.cards.filter(c => c.src === 'review' && c.reps).length };
}
function endSession(result) {
  if (!X) return;
  clearInterval(X.timer);
  try { X.wake?.release(); } catch {}
  X = null;
  TTS.cancel();
  $('#player').hidden = true; $('#home').hidden = false;
  renderHome(result);
  window.scrollTo(0, 0);
}

/* ---------- lesson writing (Claude) ---------- */
function genPrompt(code, id, topic) {
  const L = langInfo(code); const n = /^\d+$/.test(id) ? +id : null;
  const th = topic ? { title: topic, goal: 'handle this situation: ' + topic, grammar: 'only what this situation needs, kept simple' } : theme(n);
  const P = prog(code);
  const known = Object.values(P.items).filter(i => i.kind === 'item').slice(-220).map(i => `${i.t} = ${i.en}`).join('\n');
  const g = S.settings.gender;
  const genderRule = g === 'neutral'
    ? 'Where the language marks the speaker\'s gender, prefer phrasings that avoid it; if unavoidable, use the masculine form in "t" and give the feminine form in "note".'
    : `The learner is ${g === 'male' ? 'a man' : 'a woman'}: use forms that agree with that.`;
  return `You are writing ${topic ? 'a custom lesson' : 'lesson ' + n + ' of 30'} of an audio-first, spaced-recall course that teaches ${L.name}${L.native ? ' (' + L.native + ')' : ''} to an English speaker. Locale/TTS code: ${code}.
The learner hears an English cue, says the ${L.name} aloud during a pause, then hears a native voice give the answer. Everything you write will be spoken by a text-to-speech engine.

Lesson theme: ${th.title}
Can-do goal: ${th.goal}
Grammar focus: ${th.grammar}

${known ? 'The learner already knows these items. Do NOT teach them again as new items, but reuse several of them in the drills and the dialogue:\n' + known : 'This is the learner\'s first contact with the language.'}

Write:
- "title": a short English title (2–5 words).
- "dialogue": 6–9 short lines between "A" (the learner's role) and "B". Natural everyday speech that uses only this lesson's new items plus known items.
- "items": 9–12 NEW items (single words or short fixed chunks), ordered so each builds on the ones before; most useful, highest-frequency forms first.
- "drills": 8–11 short sentences the learner can build from new + known items alone (no unseen words), each with an English cue.
- "tips": 1–3 spoken tips in English (pronunciation, politeness or grammar), each under 25 words.

Rules for every item: "t" = the ${L.name} in its standard native script; "r" = romanization ONLY if ${L.name} is not normally written in Latin script (Pinyin with tone marks for Mandarin, Jyutping for Cantonese, Hepburn for Japanese, Revised Romanization for Korean, a standard transliteration otherwise), else ""; "en" = a short English cue (e.g. "please", "I would like"); "build" = backward build-up chunks: for items of 3+ syllables or several words, 2–4 progressively longer pronounceable tails taken from the END of the item, the last chunk equal to "t" (e.g. Spanish "por favor" -> ["favor","por favor"]); [] for short items. Each chunk must be read correctly by a TTS engine exactly as written (in Japanese, never cut where a particle's reading would change). "note" = optional usage note under 20 words, else "".
Drills and dialogue lines have "t", "r" and "en" with the same conventions.
Register: polite and neutral, as a visitor would speak with strangers, unless the theme is about friends or family. ${genderRule}
Accuracy matters more than variety: use only forms you are certain are correct and natural; prefer a simpler phrase over a doubtful one. Use the standard written form (for languages with several standards, the one matching ${code}).

Reply with ONLY this JSON object, no commentary:
{"title":"","dialogue":[{"s":"A","t":"","r":"","en":""}],"items":[{"t":"","r":"","en":"","build":[],"note":""}],"drills":[{"t":"","r":"","en":""}],"tips":[""]}`;
}
function normLesson(raw, title) {
  const str = v => (typeof v === 'string' ? v.trim() : '');
  const arr = v => (Array.isArray(v) ? v : []);
  const L = { v: 1, title: str(raw?.title) || title || 'Lesson', ai: true,
    dialogue: arr(raw?.dialogue).map(d => ({ s: str(d?.s).toUpperCase() === 'B' ? 'B' : 'A', t: str(d?.t), r: str(d?.r), en: str(d?.en) })).filter(d => d.t).slice(0, 12),
    items: arr(raw?.items).map(i => ({ t: str(i?.t), r: str(i?.r), en: str(i?.en), note: str(i?.note), build: arr(i?.build).map(str).filter(Boolean).slice(0, 4) })).filter(i => i.t && i.en).slice(0, 14),
    drills: arr(raw?.drills).map(d => ({ t: str(d?.t), r: str(d?.r), en: str(d?.en) })).filter(d => d.t && d.en).slice(0, 12),
    tips: arr(raw?.tips).map(str).filter(Boolean).slice(0, 3) };
  for (const i of L.items) {
    if (i.build.length && norm(i.build[i.build.length - 1]) !== norm(i.t)) i.build.push(i.t);
    if (i.build.length < 2) i.build = [];
  }
  if (L.items.length < 3) throw { code: 'bad_lesson', message: 'The lesson came back incomplete.' };
  return L;
}
let GEN = null;
async function generateLesson(code, id, topic) {

      onText: ({ text }) => { if (GEN) { GEN.chars = text.length; const m = $('#genMeter'); if (m) m.style.width = Math.min(96, text.length / 45) + '%'; const c = $('#genChars'); if (c) c.textContent = text.length.toLocaleString() + ' characters written'; } } });
    const L = normLesson(raw, topic);

    phrases, error, h('button', { class: 'btn primary', onclick: () => {
      try {
        if (!title.value.trim()) throw new Error('Give your lesson a title.');
        const items = parsePhraseLines(phrases.value);
        const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        saveLesson(code, id, { v: 1, title: title.value.trim(), ai: false, items, drills: [], dialogue: [], tips: [] });
        closeSheet(); renderHome(null, { readyId: id });
      } catch (e) { error.textContent = e.message; }
    } }, 'Save lesson')));
  title.focus();
}
function openPhrasebook() {
  const code = S.lang;
  const q = h('input', { class: 'search', type: 'search', 'aria-label': 'Search phrases', placeholder: 'Search translations or English cues' });
  const filter = h('select', { class: 'search', 'aria-label': 'Filter phrases' },
    h('option', { value: 'all' }, 'All learned phrases'), h('option', { value: 'due' }, 'Due for review'));
  const list = h('ul', { class: 'wordlist' });
  const count = h('div', { class: 'muted', role: 'status' });
  const draw = () => {
    const query = norm(q.value);
    const items = Object.values(prog(code).items).filter(i =>
      (filter.value !== 'due' || i.due <= Date.now()) &&
      (!query || [i.t, i.en, i.r].some(v => norm(v).includes(query))))
      .sort((a, b) => a.en.localeCompare(b.en));
    count.textContent = items.length ? `${items.length} phrases` : 'No matching phrases. Complete a lesson to grow your phrasebook.';
    list.replaceChildren(...items.map(i => h('li', null,
      h('div', null, h('div', { class: 'w', dir: 'auto', lang: code }, i.t),
        S.settings.roman && i.r ? h('div', { class: 'muted' }, i.r) : null,
        h('div', null, i.en), h('small', { class: 'muted' }, i.due <= Date.now() ? 'Due for review' : 'Review ' + new Date(i.due).toLocaleDateString())),
      h('button', { class: 'btn', 'aria-label': 'Listen: ' + i.en, onclick: () => {
        TTS.cancel(); TTS.speak(i.t, { lang: code, rate: S.settings.rate });
      } }, 'Listen'))));
  };
  q.addEventListener('input', draw); filter.addEventListener('change', draw);
  sheet('Your phrasebook', h('div', { class: 'body' }, q, filter, count, list));
  draw(); q.focus();
}
function openTopic() {
  const L = cur();
  const inp = h('input', { class: 'search', id: 'topicIn', placeholder: 'e.g. checking in at the airport', maxlength: 120 });
  const err = h('div', { class: 'err' });
  const go = () => {
    const t = inp.value.trim(); if (t.length < 3) { err.textContent = 'Describe the situation in a few words.'; return; }
    if (!Cloud.sample) { err.textContent = 'Writing lessons needs this page open in Claude.'; return; }
    closeSheet(); generateLesson(L.code, 'c' + Date.now().toString(36), t);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  sheet('Lesson on any topic', h('div', { class: 'body' },
    h('p', { class: 'muted', style: 'margin:0;font-size:14px' }, `Claude writes a ${L.name} lesson for the situation you describe, using the ${Object.keys(prog(L.code).items).length} phrases you already know.`),
    inp, err, h('button', { class: 'btn primary', onclick: go }, h('span', null, 'Write this lesson'))));
  setTimeout(() => inp.focus(), 50);
}

/* ---------- boot ---------- */
loadLocal();
TTS.init();
renderHome();
Cloud.init();
window.__parley = { S, startSession, prog, getLesson, contains, normLesson, genPrompt, get X() { return X; } };

</script>
