<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parley Audio Language Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one listening column; the interval ladder (5s → 2y) is the signature element. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#141D26; --muted:#5A6672; --line:#D3DAE1;
  --accent:#2445D6; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB; --recall:#C9701E; --good:#1D7F55; --bad:#B83A33;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --script:system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans CJK JP", "Noto Sans Arabic", "Noto Sans Devanagari", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131A; --surface:#161F29; --ink:#E6ECF2; --muted:#93A0AD; --line:#2A3542;
    --accent:#8DA3FF; --accent-ink:#0D131A; --accent-soft:#1E2A4A; --recall:#F0A25A; --good:#4CC38A; --bad:#F2766D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#161F29; --ink:#E6ECF2; --muted:#93A0AD; --line:#2A3542;
  --accent:#8DA3FF; --accent-ink:#0D131A; --accent-soft:#1E2A4A; --recall:#F0A25A; --good:#4CC38A; --bad:#F2766D; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.brand{font:700 22px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.02em;margin-top:4px;white-space:nowrap}
.chip{min-width:0;max-width:58%;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.chip .cl{overflow:hidden;text-overflow:ellipsis}
.chev{display:flex;flex:none}
.icon{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:30px;line-height:1.1}
.hero .native{font:500 15px var(--script);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-top:2px solid var(--line);padding-top:6px}
.stat b{display:block;font:500 22px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.due b{color:var(--recall)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex-direction:column;align-items:flex-start;gap:2px;padding:14px 18px}
.btn.primary .sub{font-weight:400;font-size:13px;opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.voice{font-size:13px;display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;margin-top:6px}
.dot.warn{background:var(--recall)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lessons li{border-top:1px solid var(--line)}
.lessons li:first-child{border-top:0}
.lessons button{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:none;border:0;padding:11px 2px;text-align:left}
.lessons .n{font:500 13px var(--mono);color:var(--muted)}
.lessons .t{font-weight:500}
.pill{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.pill.ready{border-color:var(--accent);color:var(--accent)}
.pill.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.method{display:grid;gap:14px}
.method div{display:grid;grid-template-columns:28px 1fr;gap:8px}
.method .k{font:500 13px var(--mono);color:var(--accent);padding-top:2px}
.method p{margin:2px 0 0;color:var(--muted);font-size:14px}
/* Interval ladder */
.ladder{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;align-items:end}
.ladder .rung{display:flex;flex-direction:column;align-items:center;gap:4px}
.ladder .bar{width:100%;border-radius:4px 4px 2px 2px;background:var(--line);transition:background .25s}
.ladder .lbl{font:500 11px var(--mono);color:var(--muted)}
.ladder .rung.past .bar{background:var(--accent-soft)}
.ladder .rung.on .bar{background:var(--recall)}
.ladder .rung.on .lbl{color:var(--ink)}
.ladder-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet header h2{margin-right:auto}
.sheet .body{overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:16px}
.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit}
.langlist{list-style:none;margin:0;padding:0}
.langlist button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.langlist .nm{flex:1}
.langlist .nt{font:14px var(--script);color:var(--muted)}
.langlist .sel{color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.danger{color:var(--bad);border-color:var(--bad)}
/* Player */
#player{min-height:100%;display:flex;flex-direction:column}
.pwrap{max-width:560px;width:100%;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.pbar{display:flex;align-items:center;gap:10px}
.ptitle{flex:1;display:flex;flex-direction:column;line-height:1.2}
.ptitle b{font:700 16px var(--display)}
.ptitle span{font-size:12px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent);transition:width .3s}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:300px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:300px;justify-content:center}
.tag{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag.recall{color:var(--recall)}
.cue{font:500 22px/1.3 var(--body);text-wrap:balance}
.target{font:600 32px/1.25 var(--script);text-wrap:balance;min-height:1.25em;transition:filter .25s, opacity .25s}
.target.veiled{filter:blur(10px);opacity:.35;user-select:none}
.build{font:500 18px var(--script);color:var(--accent);min-height:1.4em}
.roman{font:italic 16px var(--body);color:var(--muted)}
.note{font-size:14px;color:var(--muted);max-width:40ch}
.ringbox{position:relative;width:84px;height:84px;display:grid;place-items:center}
.ringbox svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:5}
.ringbox .trk{stroke:var(--line)}
.ringbox .arc{stroke:var(--recall);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ringbox span{font:500 13px var(--mono);color:var(--muted)}
.speaking{display:flex;gap:3px;height:18px;align-items:center}
.speaking i{width:3px;height:6px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
.speaking i:nth-child(2){animation-delay:.15s}.speaking i:nth-child(3){animation-delay:.3s}.speaking i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.dialogue{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid transparent}
.line.cur{border-color:var(--accent);background:var(--surface)}
.line .who{font:600 12px var(--mono);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.line.b .who{background:var(--line);color:var(--ink)}
.line .lt{font:500 19px/1.35 var(--script)}
.line .lr{font:italic 13px var(--body);color:var(--muted)}
.line .le{font-size:13px;color:var(--muted)}
.line.veil .lt,.line.veil .lr{filter:blur(7px);opacity:.4}
.line.veil .le{visibility:hidden}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.controls .btn{padding:12px 10px}
.round{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center}
.round svg{width:26px;height:26px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grade .btn{padding:16px}
.btn.miss{border-color:var(--bad);color:var(--bad)}
.btn.got{background:var(--good);border-color:var(--good);color:var(--surface)}
.tip{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.summary .big{font:700 44px/1 var(--display)}
.wordlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wordlist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.wordlist .w{font:500 16px var(--script)}
.gen{display:flex;flex-direction:column;gap:10px}
.gen .meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.gen .meter div{height:100%;width:0;background:var(--accent);transition:width .3s}
.err{color:var(--bad);font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
select.search{appearance:auto;min-height:44px}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
@media (max-width:400px){ .hero h1{font-size:26px} .target{font-size:28px} }
</style>
</head>
<body>
<div id="home" class="wrap"></div>
<section id="player" hidden>
  <div class="pwrap">
    <div class="pbar">
      <button class="icon" id="pExit" aria-label="End lesson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="ptitle"><b id="pPhase">Listen</b><span id="pLesson" class="muted"></span></div>
      <span id="pTime" class="mono muted">0:00</span>
    </div>
    <div class="progress"><div id="pProg"></div></div>
    <div class="stage">
      <div class="card" id="cardView">
        <div class="tag" id="cTag"></div>
        <div class="cue" id="cCue"></div>
        <div class="target" id="cTarget" dir="auto"></div>
        <div class="build" id="cBuild" dir="auto"></div>
        <div class="roman" id="cRoman"></div>
        <div class="ringbox" id="ring" hidden>
          <svg viewBox="0 0 84 84"><circle class="trk" cx="42" cy="42" r="38"/><circle class="arc" id="ringArc" cx="42" cy="42" r="38" stroke-dasharray="238.76" stroke-dashoffset="0"/></svg>
          <span id="ringTxt">say it</span>
        </div>
        <div class="speaking" id="spk" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="note" id="cNote"></div>
      </div>
      <div class="dialogue" id="dlgView" hidden></div>
    </div>
    <div id="pTip" class="tip" hidden></div>
    <div>
      <div class="ladder" id="pLadder"></div>
      <div class="ladder-cap"><span>in this lesson</span><span>future reviews</span></div>
    </div>
    <div class="controls" id="ctrls">
      <button class="btn" id="bReplay">Replay</button>
      <button class="round" id="bPause" aria-label="Pause"></button>
      <button class="btn" id="bReveal">Reveal</button>
    </div>
    <div class="grade" id="grade" hidden>
      <button class="btn miss" id="bMiss">Missed it</button>
      <button class="btn got" id="bGot">Got it</button>
    </div>
  </div>
</section>
<div id="layer"></div>
<script>
/*CONTENT*/
/*APP*/
</script>
</body>
</html>
